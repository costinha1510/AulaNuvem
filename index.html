<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Point do Lanche</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <!-- CABEÇALHO -->
  <header>
    <div class="header-content">
      <div class="logo">🍔 Point do Lanche</div>

      <button class="cart-button" onclick="abrirCarrinho()">
        🛒 Carrinho (<span id="cartCount">0</span>)
      </button>
    </div>

  </header>

  <!-- BANNER -->
  <section class="hero">
    <h1>🍔 Point do Lanche</h1>
    <p>Seu lanche favorito na palma da mão!</p>
  </section>

  <main class="container">

    <!-- BUSCA -->
    <input
      type="text"
      id="search"
      class="search"
      placeholder="🔎 Procurar lanche..."
      oninput="renderProdutos()"
    >

    <!-- CATEGORIAS -->
    <div class="categories">
      <button
        class="category-btn active"
        onclick="selecionarCategoria('Todos', this)">
        Todos
      </button>

      <button
        class="category-btn"
        onclick="selecionarCategoria('Hambúrgueres', this)">
        🍔 Hambúrgueres
      </button>

      <button
        class="category-btn"
        onclick="selecionarCategoria('Hot Dogs', this)">
        🌭 Hot Dogs
      </button>

      <button
        class="category-btn"
        onclick="selecionarCategoria('Porções', this)">
        🍟 Porções
      </button>

      <button
        class="category-btn"
        onclick="selecionarCategoria('Bebidas', this)">
        🥤 Bebidas
      </button>
    </div>

    <!-- PRODUTOS -->
    <div id="products" class="products"></div>

  </main>

  <!-- RODAPÉ -->
  <footer>
    <p>© 2026 Point do Lanche</p>
    <p>Pedidos online • Entrega rápida</p>
  </footer>


  <!-- MODAL DO CARRINHO -->
  <div id="cartModal" class="modal">

    <div class="modal-content">

      <button class="close" onclick="fecharCarrinho()">×</button>

      <h2 class="modal-title">🛒 Seu Carrinho</h2>

      <div id="cartItems"></div>

      <div id="cartSummary"></div>

    </div>

  </div>


  <!-- MODAL FINALIZAÇÃO -->
  <div id="checkoutModal" class="modal">

    <div class="modal-content">

      <button class="close" onclick="fecharCheckout()">×</button>

      <h2 class="modal-title">📋 Finalizar Pedido</h2>

      <div class="form-group">
        <label>Nome</label>
        <input
          type="text"
          id="clienteNome"
          placeholder="Digite seu nome"
        >
      </div>

      <div class="form-group">
        <label>Telefone</label>
        <input
          type="tel"
          id="clienteTelefone"
          placeholder="(85) 99999-9999"
        >
      </div>

      <div class="form-group">
        <label>Endereço</label>
        <input
          type="text"
          id="clienteEndereco"
          placeholder="Rua, número"
        >
      </div>

      <div class="form-group">
        <label>Bairro</label>
        <input
          type="text"
          id="clienteBairro"
          placeholder="Seu bairro"
        >
      </div>

      <div class="form-group">
        <label>Complemento</label>
        <input
          type="text"
          id="clienteComplemento"
          placeholder="Apartamento, casa, referência..."
        >
      </div>

      <div class="form-group">
        <label>Forma de pagamento</label>

        <select id="pagamento">
          <option value="">Selecione</option>
          <option value="Pix">Pix</option>
          <option value="Dinheiro">Dinheiro</option>
          <option value="Cartão de crédito">Cartão de crédito</option>
          <option value="Cartão de débito">Cartão de débito</option>
        </select>
      </div>

      <div
        id="trocoContainer"
        class="form-group"
        style="display:none;"
      >
        <label>Troco para quanto?</label>

        <input
          type="number"
          id="troco"
          placeholder="Ex: 50"
          min="0"
          step="0.01"
        >
      </div>

      <div class="form-group">
        <label>Observação</label>

        <textarea
          id="observacao"
          placeholder="Ex: Sem cebola, pouco molho..."
        ></textarea>
      </div>

      <div class="delivery-info">
        🚚 Taxa de entrega: <strong>R$ 5,00</strong>
      </div>

      <div id="checkoutTotal"></div>

      <button
        class="checkout-button"
        onclick="finalizarPedido()"
      >
        📲 Enviar pedido pelo WhatsApp
      </button>

    </div>

  </div>

  <script src = "script.js"></script>


</body>
</html>
