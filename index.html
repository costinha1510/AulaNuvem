<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Point do Lanche</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      background: #f5f5f5;
      color: #222;
    }

    header {
      background: #ff6b00;
      color: white;
      padding: 18px 5%;
      position: sticky;
      top: 0;
      z-index: 1000;
      box-shadow: 0 3px 10px rgba(0,0,0,0.15);
    }

    .header-content {
      max-width: 1200px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .logo {
      font-size: 25px;
      font-weight: bold;
    }

    .cart-button {
      background: white;
      color: #ff6b00;
      border: none;
      padding: 12px 18px;
      border-radius: 25px;
      font-weight: bold;
      cursor: pointer;
      font-size: 15px;
    }

    .hero {
      background: linear-gradient(135deg, #ff6b00, #ff9800);
      color: white;
      padding: 50px 20px;
      text-align: center;
    }

    .hero h1 {
      font-size: 42px;
      margin-bottom: 10px;
    }

    .hero p {
      font-size: 18px;
      opacity: 0.95;
    }

    .container {
      max-width: 1200px;
      margin: auto;
      padding: 30px 20px;
    }

    .search {
      width: 100%;
      padding: 15px;
      border: 1px solid #ddd;
      border-radius: 10px;
      margin-bottom: 25px;
      font-size: 16px;
      outline: none;
    }

    .categories {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      margin-bottom: 30px;
      padding-bottom: 5px;
    }

    .category-btn {
      border: none;
      background: white;
      color: #333;
      padding: 12px 18px;
      border-radius: 25px;
      cursor: pointer;
      white-space: nowrap;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .category-btn.active,
    .category-btn:hover {
      background: #ff6b00;
      color: white;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }

    .product {
      background: white;
      border-radius: 15px;
      overflow: hidden;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
      transition: 0.2s;
    }

    .product:hover {
      transform: translateY(-3px);
    }

    .product-image {
      height: 180px;
      background: #eee;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 70px;
    }

    .product-info {
      padding: 18px;
    }

    .product-info h3 {
      margin-bottom: 8px;
      font-size: 19px;
    }

    .product-info p {
      color: #777;
      font-size: 14px;
      min-height: 40px;
      margin-bottom: 12px;
    }

    .product-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .price {
      font-size: 18px;
      font-weight: bold;
      color: #ff6b00;
    }

    .add-button {
      background: #ff6b00;
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    .add-button:hover {
      background: #e65f00;
    }

    /* MODAL */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 2000;
      padding: 20px;
      overflow-y: auto;
    }

    .modal-content {
      background: white;
      max-width: 600px;
      margin: 30px auto;
      border-radius: 15px;
      padding: 25px;
      position: relative;
    }

    .close {
      position: absolute;
      right: 20px;
      top: 15px;
      border: none;
      background: transparent;
      font-size: 28px;
      cursor: pointer;
    }

    .modal-title {
      margin-bottom: 20px;
      font-size: 25px;
    }

    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid #eee;
      padding: 15px 0;
    }

    .cart-item-info {
      flex: 1;
    }

    .cart-item-info strong {
      display: block;
      margin-bottom: 5px;
    }

    .quantity {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .quantity button {
      border: none;
      background: #ff6b00;
      color: white;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      cursor: pointer;
    }

    .cart-total {
      margin-top: 20px;
      border-top: 2px solid #eee;
      padding-top: 15px;
    }

    .total-line {
      display: flex;
      justify-content: space-between;
      margin: 8px 0;
    }

    .total-final {
      font-size: 22px;
      font-weight: bold;
      color: #ff6b00;
    }

    .checkout-button {
      width: 100%;
      margin-top: 20px;
      background: #25d366;
      color: white;
      border: none;
      padding: 15px;
      border-radius: 10px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .checkout-button:hover {
      background: #1ebe5d;
    }

    .empty {
      text-align: center;
      color: #777;
      padding: 30px 0;
    }

    /* FORMULÁRIO */
    .form-group {
      margin-top: 15px;
    }

    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 8px;
      outline: none;
      font-size: 15px;
    }

    .form-group textarea {
      resize: vertical;
      min-height: 80px;
    }

    .delivery-info {
      background: #fff7ef;
      border: 1px solid #ffd4b0;
      padding: 12px;
      border-radius: 8px;
      margin-top: 15px;
      color: #555;
    }

    footer {
      margin-top: 50px;
      background: #222;
      color: white;
      text-align: center;
      padding: 30px 20px;
    }

    @media (max-width: 600px) {
      .hero h1 {
        font-size: 32px;
      }

      .header-content {
        flex-direction: row;
      }

      .logo {
        font-size: 20px;
      }

      .cart-button {
        padding: 10px 12px;
        font-size: 13px;
      }

      .product-image {
        height: 150px;
      }
    }
  </style>
</head>

<body>

  <!-- CABEÇALHO -->
  <header>
    <div class="header-content">
      <div class="logo">🍔 Point do Lanche</div>

      <button class="cart-button" onclick="abrirCarrinho()">
        🛒 Carrinho (<span id="cartCount">0</span>)
      </button>
    </div>
  </header>

  <!-- BANNER -->
  <section class="hero">
    <h1>🍔 Point do Lanche</h1>
    <p>Seu lanche favorito na palma da mão!</p>
  </section>

  <main class="container">

    <!-- BUSCA -->
    <input
      type="text"
      id="search"
      class="search"
      placeholder="🔎 Procurar lanche..."
      oninput="renderProdutos()"
    >

    <!-- CATEGORIAS -->
    <div class="categories">
      <button
        class="category-btn active"
        onclick="selecionarCategoria('Todos', this)">
        Todos
      </button>

      <button
        class="category-btn"
        onclick="selecionarCategoria('Hambúrgueres', this)">
        🍔 Hambúrgueres
      </button>

      <button
        class="category-btn"
        onclick="selecionarCategoria('Hot Dogs', this)">
        🌭 Hot Dogs
      </button>

      <button
        class="category-btn"
        onclick="selecionarCategoria('Porções', this)">
        🍟 Porções
      </button>

      <button
        class="category-btn"
        onclick="selecionarCategoria('Bebidas', this)">
        🥤 Bebidas
      </button>
    </div>

    <!-- PRODUTOS -->
    <div id="products" class="products"></div>

  </main>

  <!-- RODAPÉ -->
  <footer>
    <p>© 2026 Point do Lanche</p>
    <p>Pedidos online • Entrega rápida</p>
  </footer>


  <!-- MODAL DO CARRINHO -->
  <div id="cartModal" class="modal">

    <div class="modal-content">

      <button class="close" onclick="fecharCarrinho()">×</button>

      <h2 class="modal-title">🛒 Seu Carrinho</h2>

      <div id="cartItems"></div>

      <div id="cartSummary"></div>

    </div>

  </div>


  <!-- MODAL FINALIZAÇÃO -->
  <div id="checkoutModal" class="modal">

    <div class="modal-content">

      <button class="close" onclick="fecharCheckout()">×</button>

      <h2 class="modal-title">📋 Finalizar Pedido</h2>

      <div class="form-group">
        <label>Nome</label>
        <input
          type="text"
          id="clienteNome"
          placeholder="Digite seu nome"
        >
      </div>

      <div class="form-group">
        <label>Telefone</label>
        <input
          type="tel"
          id="clienteTelefone"
          placeholder="(85) 99999-9999"
        >
      </div>

      <div class="form-group">
        <label>Endereço</label>
        <input
          type="text"
          id="clienteEndereco"
          placeholder="Rua, número"
        >
      </div>

      <div class="form-group">
        <label>Bairro</label>
        <input
          type="text"
          id="clienteBairro"
          placeholder="Seu bairro"
        >
      </div>

      <div class="form-group">
        <label>Complemento</label>
        <input
          type="text"
          id="clienteComplemento"
          placeholder="Apartamento, casa, referência..."
        >
      </div>

      <div class="form-group">
        <label>Forma de pagamento</label>

        <select id="pagamento">
          <option value="">Selecione</option>
          <option value="Pix">Pix</option>
          <option value="Dinheiro">Dinheiro</option>
          <option value="Cartão de crédito">Cartão de crédito</option>
          <option value="Cartão de débito">Cartão de débito</option>
        </select>
      </div>

      <div
        id="trocoContainer"
        class="form-group"
        style="display:none;"
      >
        <label>Troco para quanto?</label>

        <input
          type="number"
          id="troco"
          placeholder="Ex: 50"
          min="0"
          step="0.01"
        >
      </div>

      <div class="form-group">
        <label>Observação</label>

        <textarea
          id="observacao"
          placeholder="Ex: Sem cebola, pouco molho..."
        ></textarea>
      </div>

      <div class="delivery-info">
        🚚 Taxa de entrega: <strong>R$ 5,00</strong>
      </div>

      <div id="checkoutTotal"></div>

      <button
        class="checkout-button"
        onclick="finalizarPedido()"
      >
        📲 Enviar pedido pelo WhatsApp
      </button>

    </div>

  </div>


<script>

  /*
  =====================================================
  CONFIGURAÇÕES
  =====================================================
  */

  // COLOQUE AQUI O WHATSAPP DA SUA LANCHONETE
  // Exemplo: 5585999999999
  const WHATSAPP = "5585999999999";

  const TAXA_ENTREGA = 5.00;


  /*
  =====================================================
  CARDÁPIO
  =====================================================
  */

  const produtos = [

    {
      id: 1,
      nome: "X-Burger",
      descricao: "Pão, hambúrguer, queijo, presunto, alface e tomate.",
      preco: 15.00,
      categoria: "Hambúrgueres",
      emoji: "🍔"
    },

    {
      id: 2,
      nome: "X-Salada",
      descricao: "Hambúrguer, queijo, presunto, alface, tomate e molho especial.",
      preco: 18.00,
      categoria: "Hambúrgueres",
      emoji: "🍔"
    },

    {
      id: 3,
      nome: "X-Bacon",
      descricao: "Hambúrguer, queijo, bacon crocante e molho especial.",
      preco: 22.00,
      categoria: "Hambúrgueres",
      emoji: "🥓"
    },

    {
      id: 4,
      nome: "X-Tudo",
      descricao: "Hambúrguer, queijo, presunto, bacon, ovo, salada e molho.",
      preco: 28.00,
      categoria: "Hambúrgueres",
      emoji: "🍔"
    },

    {
      id: 5,
      nome: "Hot Dog Tradicional",
      descricao: "Salsicha, molho, milho, ervilha, batata palha e queijo.",
      preco: 12.00,
      categoria: "Hot Dogs",
      emoji: "🌭"
    },

    {
      id: 6,
      nome: "Hot Dog Especial",
      descricao: "2 salsichas, bacon, queijo, milho, ervilha e batata palha.",
      preco: 18.00,
      categoria: "Hot Dogs",
      emoji: "🌭"
    },

    {
      id: 7,
      nome: "Batata Frita",
      descricao: "Porção de batata frita crocante.",
      preco: 15.00,
      categoria: "Porções",
      emoji: "🍟"
    },

    {
      id: 8,
      nome: "Batata com Cheddar e Bacon",
      descricao: "Batata frita com cheddar cremoso e bacon.",
      preco: 22.00,
      categoria: "Porções",
      emoji: "🍟"
    },

    {
      id: 9,
      nome: "Coca-Cola Lata",
      descricao: "Coca-Cola 350ml gelada.",
      preco: 6.00,
      categoria: "Bebidas",
      emoji: "🥤"
    },

    {
      id: 10,
      nome: "Guaraná Lata",
      descricao: "Guaraná 350ml gelado.",
      preco: 6.00,
      categoria: "Bebidas",
      emoji: "🥤"
    },

    {
      id: 11,
      nome: "Suco Natural",
      descricao: "Suco natural feito na hora.",
      preco: 8.00,
      categoria: "Bebidas",
      emoji: "🧃"
    },

    {
      id: 12,
      nome: "Água Mineral",
      descricao: "Água mineral 500ml.",
      preco: 4.00,
      categoria: "Bebidas",
      emoji: "💧"
    }

  ];


  /*
  =====================================================
  VARIÁVEIS
  =====================================================
  */

  let carrinho =
    JSON.parse(localStorage.getItem("carrinho")) || [];

  let categoriaAtual = "Todos";


  /*
  =====================================================
  FORMATAÇÃO DE PREÇO
  =====================================================
  */

  function formatarPreco(valor) {

    return valor.toLocaleString("pt-BR", {
      style: "currency",
      currency: "BRL"
    });

  }


  /*
  =====================================================
  MOSTRAR PRODUTOS
  =====================================================
  */

  function renderProdutos() {

    const container =
      document.getElementById("products");

    const busca =
      document
      .getElementById("search")
      .value
      .toLowerCase();

    let lista = produtos.filter(produto => {

      const correspondeCategoria =
        categoriaAtual === "Todos" ||
        produto.categoria === categoriaAtual;

      const correspondeBusca =
        produto.nome
        .toLowerCase()
        .includes(busca) ||

        produto.descricao
        .toLowerCase()
        .includes(busca);

      return correspondeCategoria && correspondeBusca;

    });


    if (lista.length === 0) {

      container.innerHTML = `
        <div class="empty">
          <h3>Nenhum produto encontrado 😕</h3>
          <p>Tente outra busca.</p>
        </div>
      `;

      return;
    }


    container.innerHTML = lista.map(produto => `

      <div class="product">

        <div class="product-image">
          ${produto.emoji}
        </div>

        <div class="product-info">

          <h3>${produto.nome}</h3>

          <p>${produto.descricao}</p>

          <div class="product-bottom">

            <span class="price">
              ${formatarPreco(produto.preco)}
            </span>

            <button
              class="add-button"
              onclick="adicionarCarrinho(${produto.id})"
            >
              + Adicionar
            </button>

          </div>

        </div>

      </div>

    `).join("");

  }


  /*
  =====================================================
  SELECIONAR CATEGORIA
  =====================================================
  */

  function selecionarCategoria(categoria, botao) {

    categoriaAtual = categoria;

    document
      .querySelectorAll(".category-btn")
      .forEach(btn => btn.classList.remove("active"));

    botao.classList.add("active");

    renderProdutos();

  }


  /*
  =====================================================
  ADICIONAR AO CARRINHO
  =====================================================
  */

  function adicionarCarrinho(id) {

    const produto =
      produtos.find(p => p.id === id);

    const item =
      carrinho.find(p => p.id === id);


    if (item) {

      item.quantidade++;

    } else {

      carrinho.push({
        ...produto,
        quantidade: 1
      });

    }


    salvarCarrinho();

    atualizarContador();

    mostrarMensagem(`${produto.nome} adicionado ao carrinho!`);

  }


  /*
  =====================================================
  SALVAR CARRINHO
  =====================================================
  */

  function salvarCarrinho() {

    localStorage.setItem(
      "carrinho",
      JSON.stringify(carrinho)
    );

  }


  /*
  =====================================================
  CONTADOR
  =====================================================
  */

  function atualizarContador() {

    const quantidade =
      carrinho.reduce(
        (total, item) =>
        total + item.quantidade,
        0
      );

    document.getElementById("cartCount")
      .textContent = quantidade;

  }


  /*
  =====================================================
  ABRIR CARRINHO
  =====================================================
  */

  function abrirCarrinho() {

    document.getElementById("cartModal")
      .style.display = "block";

    renderCarrinho();

  }


  /*
  =====================================================
  FECHAR CARRINHO
  =====================================================
  */

  function fecharCarrinho() {

    document.getElementById("cartModal")
      .style.display = "none";

  }


  /*
  =====================================================
  RENDERIZAR CARRINHO
  =====================================================
  */

  function renderCarrinho() {

    const container =
      document.getElementById("cartItems");

    const summary =
      document.getElementById("cartSummary");


    if (carrinho.length === 0) {

      container.innerHTML = `
        <div class="empty">
          <h3>Seu carrinho está vazio 🛒</h3>
          <p>Adicione alguns produtos!</p>
        </div>
      `;

      summary.innerHTML = "";

      return;

    }


    container.innerHTML =
      carrinho.map(item => `

        <div class="cart-item">

          <div class="cart-item-info">

            <strong>
              ${item.emoji} ${item.nome}
            </strong>

            <span>
              ${formatarPreco(item.preco)}
            </span>

          </div>


          <div class="quantity">

            <button
              onclick="alterarQuantidade(${item.id}, -1)"
            >
              −
            </button>

            <strong>
              ${item.quantidade}
            </strong>

            <button
              onclick="alterarQuantidade(${item.id}, 1)"
            >
              +
            </button>

          </div>

        </div>

      `).join("");


    const subtotal = calcularSubtotal();

    const total = subtotal + TAXA_ENTREGA;


    summary.innerHTML = `

      <div class="cart-total">

        <div class="total-line">
          <span>Subtotal:</span>
          <strong>${formatarPreco(subtotal)}</strong>
        </div>

        <div class="total-line">
          <span>Entrega:</span>
          <strong>${formatarPreco(TAXA_ENTREGA)}</strong>
        </div>

        <div class="total-line total-final">
          <span>Total:</span>
          <strong>${formatarPreco(total)}</strong>
        </div>

        <button
          class="checkout-button"
          onclick="abrirCheckout()"
        >
          Continuar para pagamento
        </button>

      </div>

    `;

  }


  /*
  =====================================================
  ALTERAR QUANTIDADE
  =====================================================
  */

  function alterarQuantidade(id, quantidade) {

    const item =
      carrinho.find(p => p.id === id);

    if (!item) return;


    item.quantidade += quantidade;


    if (item.quantidade <= 0) {

      carrinho =
        carrinho.filter(p => p.id !== id);

    }


    salvarCarrinho();

    atualizarContador();

    renderCarrinho();

  }


  /*
  =====================================================
  CALCULAR SUBTOTAL
  =====================================================
  */

  function calcularSubtotal() {

    return carrinho.reduce(
      (total, item) =>
        total + item.preco * item.quantidade,
      0
    );

  }


  /*
  =====================================================
  ABRIR CHECKOUT
  =====================================================
  */

  function abrirCheckout() {

    if (carrinho.length === 0) {

      alert("Seu carrinho está vazio.");

      return;

    }


    fecharCarrinho();

    document.getElementById("checkoutModal")
      .style.display = "block";


    atualizarTotalCheckout();

  }


  /*
  =====================================================
  FECHAR CHECKOUT
  =====================================================
  */

  function fecharCheckout() {

    document.getElementById("checkoutModal")
      .style.display = "none";

  }


  /*
  =====================================================
  TOTAL DO CHECKOUT
  =====================================================
  */

  function atualizarTotalCheckout() {

    const subtotal = calcularSubtotal();

    const total = subtotal + TAXA_ENTREGA;


    document.getElementById("checkoutTotal")
      .innerHTML = `

        <div class="cart-total">

          <div class="total-line">
            <span>Subtotal:</span>
            <strong>${formatarPreco(subtotal)}</strong>
          </div>

          <div class="total-line">
            <span>Entrega:</span>
            <strong>${formatarPreco(TAXA_ENTREGA)}</strong>
          </div>

          <div class="total-line total-final">
            <span>Total:</span>
            <strong>${formatarPreco(total)}</strong>
          </div>

        </div>

      `;

  }


  /*
  =====================================================
  FORMA DE PAGAMENTO
  =====================================================
  */

  document.getElementById("pagamento")
    .addEventListener("change", function() {

      const trocoContainer =
        document.getElementById("trocoContainer");


      if (this.value === "Dinheiro") {

        trocoContainer.style.display = "block";

      } else {

        trocoContainer.style.display = "none";

      }

    });


  /*
  =====================================================
  FINALIZAR PEDIDO
  =====================================================
  */

  function finalizarPedido() {

    const nome =
      document.getElementById("clienteNome")
      .value.trim();

    const telefone =
      document.getElementById("clienteTelefone")
      .value.trim();

    const endereco =
      document.getElementById("clienteEndereco")
      .value.trim();

    const bairro =
      document.getElementById("clienteBairro")
      .value.trim();

    const complemento =
      document.getElementById("clienteComplemento")
      .value.trim();

    const pagamento =
      document.getElementById("pagamento")
      .value;

    const troco =
      document.getElementById("troco")
      .value;

    const observacao =
      document.getElementById("observacao")
      .value.trim();


    if (!nome) {

      alert("Digite seu nome.");

      return;

    }


    if (!telefone) {

      alert("Digite seu telefone.");

      return;

    }


    if (!endereco) {

      alert("Digite seu endereço.");

      return;

    }


    if (!bairro) {

      alert("Digite seu bairro.");

      return;

    }


    if (!pagamento) {

      alert("Selecione a forma de pagamento.");

      return;

    }


    if (
      pagamento === "Dinheiro" &&
      (!troco || Number(troco) <= 0)
    ) {

      alert("Informe o valor para o troco.");

      return;

    }


    const subtotal = calcularSubtotal();

    const total = subtotal + TAXA_ENTREGA;


    let mensagem =
      `*🍔 NOVO PEDIDO - POINT DO LANCHE*%0A%0A`;


    mensagem +=
      `*CLIENTE*%0A`;

    mensagem +=
      `Nome: ${nome}%0A`;

    mensagem +=
      `Telefone: ${telefone}%0A%0A`;


    mensagem +=
      `*ENDEREÇO*%0A`;

    mensagem +=
      `${endereco}%0A`;

    mensagem +=
      `Bairro: ${bairro}%0A`;


    if (complemento) {

      mensagem +=
        `Complemento: ${complemento}%0A`;

    }


    mensagem += `%0A*PEDIDO*%0A`;


    carrinho.forEach(item => {

      const totalItem =
        item.preco * item.quantidade;


      mensagem +=
        `${item.quantidade}x ${item.nome} - ${formatarPreco(totalItem)}%0A`;

    });


    mensagem += `%0A`;


    mensagem +=
      `Subtotal: ${formatarPreco(subtotal)}%0A`;

    mensagem +=
      `Taxa de entrega: ${formatarPreco(TAXA_ENTREGA)}%0A`;

    mensagem +=
      `*TOTAL: ${formatarPreco(total)}*%0A%0A`;


    mensagem +=
      `*PAGAMENTO*%0A`;

    mensagem +=
      `${pagamento}%0A`;


    if (pagamento === "Dinheiro") {

      mensagem +=
        `Troco para: ${formatarPreco(Number(troco))}%0A`;

    }


    if (observacao) {

      mensagem += `%0A*OBSERVAÇÃO*%0A`;

      mensagem +=
        `${observacao}%0A`;

    }


    mensagem += `%0AObrigado! 😊`;


    const url =
      `https://wa.me/${WHATSAPP}?text=${mensagem}`;


    window.open(url, "_blank");


    /*
    Limpa o carrinho depois de enviar
    */

    carrinho = [];

    salvarCarrinho();

    atualizarContador();

    fecharCheckout();

  }


  /*
  =====================================================
  MENSAGEM TEMPORÁRIA
  =====================================================
  */

  function mostrarMensagem(texto) {

    const mensagem =
      document.createElement("div");


    mensagem.textContent = texto;


    mensagem.style.position = "fixed";
    mensagem.style.bottom = "25px";
    mensagem.style.left = "50%";
    mensagem.style.transform = "translateX(-50%)";
    mensagem.style.background = "#222";
    mensagem.style.color = "#fff";
    mensagem.style.padding = "13px 20px";
    mensagem.style.borderRadius = "30px";
    mensagem.style.zIndex = "9999";
    mensagem.style.boxShadow =
      "0 5px 20px rgba(0,0,0,.25)";


    document.body.appendChild(mensagem);


    setTimeout(() => {

      mensagem.remove();

    }, 2000);

  }


  /*
  =====================================================
  FECHAR MODAIS CLICANDO FORA
  =====================================================
  */

  window.onclick = function(event) {

    const cartModal =
      document.getElementById("cartModal");

    const checkoutModal =
      document.getElementById("checkoutModal");


    if (event.target === cartModal) {

      fecharCarrinho();

    }


    if (event.target === checkoutModal) {

      fecharCheckout();

    }

  };


  /*
  =====================================================
  INICIALIZAÇÃO
  =====================================================
  */

  renderProdutos();

  atualizarContador();

</script>

</body>
</html>
